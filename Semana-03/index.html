<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Semana 03 - Servidor HTTP</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 1rem; color: #222; }
        h1 { color: #0a7; }
        code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Archivo HTML estático</h1>
    <p>Servido por un servidor Node.js nativo usando el módulo <code>http</code>.</p>
    <ul>
        <li><a href="/alumno">/alumno</a> — información del alumno</li>
        <li><a href="/info">/info</a> — información del sistema operativo</li>
        <li><a href="/static">/static</a> — este mismo HTML</li>
        <li><a href="/productos">/productos</a> — listado de productos</li>
    </ul>
